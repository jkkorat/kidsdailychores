<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Kids Chore Bank</title>
  <style>
    :root{--primary:#4f46e5;--primary2:#7c3aed;--green:#059669;--red:#e11d48;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--white:#fff;--shadow:0 12px 35px rgba(51,65,85,.1)}
    *{box-sizing:border-box} body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fc;min-height:100vh}
    body:before{content:"";position:fixed;z-index:-1;inset:0 0 auto;height:390px;background:linear-gradient(135deg,#e0e7ff,#fae8ff 52%,#fef3c7)}
    button,input,select{font:inherit} button{cursor:pointer}.app{max-width:1280px;margin:auto;padding:24px 18px 42px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:14px}.logo{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;font-size:29px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 10px 24px #c7d2fe}.brand h1{margin:0;font-size:clamp(1.55rem,4vw,2.1rem);letter-spacing:-.04em}.brand p{margin:3px 0 0;color:var(--muted);font-size:.9rem}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:#334155;border-radius:13px;padding:10px 14px;font-weight:800;box-shadow:0 2px 5px rgba(15,23,42,.03);transition:.18s}.btn:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(15,23,42,.08)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.good{color:#047857;border-color:#a7f3d0}.btn.bad{color:#be123c;border-color:#fecdd3}.btn.dark{background:#172033;color:#fff;border-color:#172033}.btn.small{padding:8px 11px;font-size:.82rem}.btn.icon{padding:9px 11px}.dashboard{display:grid;grid-template-columns:1.5fr 1fr;gap:15px;margin-bottom:20px}.date-box,.summary-card,.person-card,.empty,.footer{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow);border-radius:25px}.date-box{padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px}.date-heading{display:flex;align-items:center;gap:12px}.date-icon{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:#eef2ff;font-size:23px}.eyebrow{text-transform:uppercase;letter-spacing:.11em;color:#94a3b8;font-size:.68rem;font-weight:900}.date-heading strong{display:block;margin-top:2px}.date-controls{display:flex;align-items:center;gap:7px}.date-controls input{border:1px solid var(--line);border-radius:12px;padding:9px;color:#334155;font-weight:700;background:#fff}.summaries{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary-card{padding:16px 18px}.summary-card.dark{background:#172033;color:#fff}.summary-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:#94a3b8}.summary-value{font-size:1.65rem;font-weight:950;margin-top:7px}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.person-card{overflow:hidden}.person-head{padding:20px;background:var(--soft,#f5f3ff)}.person-top{display:flex;justify-content:space-between;gap:15px}.identity{display:flex;gap:12px;align-items:center}.avatar{height:58px;width:58px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:32px;box-shadow:0 4px 14px rgba(15,23,42,.07)}.person-name{font-size:1.28rem;font-weight:950}.link-button{border:0;background:transparent;color:#64748b;padding:3px}.mood{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;margin-top:6px;background:#e0e7ff;color:#4338ca;font-size:.73rem;font-weight:900}.day-total{text-align:right}.day-total span{display:block;font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;font-weight:900}.day-total strong{display:block;margin-top:3px;font-size:1.8rem;color:var(--accent,#6d28d9)}.goal{background:rgba(255,255,255,.78);padding:12px;border-radius:16px;margin-top:16px}.goal-row{display:flex;justify-content:space-between;font-size:.76rem;font-weight:850;margin-bottom:8px}.progress{height:11px;border-radius:999px;overflow:hidden;background:#e2e8f0}.progress>div{height:100%;width:0;border-radius:inherit;background:var(--accent,#7c3aed);transition:.45s}.lists{display:grid;grid-template-columns:1fr 1fr;gap:17px;padding:18px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-title h3{font-size:.95rem;margin:0}.pill{font-size:.72rem;font-weight:900;border-radius:999px;padding:5px 9px}.pill.green{color:#047857;background:#ecfdf5}.pill.red{color:#be123c;background:#fff1f2}.item-list{display:flex;flex-direction:column;gap:8px}.toggle-item{width:100%;display:flex;align-items:center;gap:10px;border:1px solid #edf1f6;border-radius:16px;padding:10px;background:#f8fafc;text-align:left;transition:.18s}.toggle-item:hover{background:#fff;border-color:#dbe2ea}.toggle-item.active.good{background:#ecfdf5;border-color:#a7f3d0}.toggle-item.active.bad{background:#fff1f2;border-color:#fecdd3}.item-icon{width:39px;height:39px;flex:0 0 39px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 2px 7px rgba(15,23,42,.05)}.item-info{min-width:0;flex:1}.item-name{font-size:.84rem;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-amount{font-size:.7rem;font-weight:950;margin-top:2px}.good .item-amount{color:var(--green)}.bad .item-amount{color:var(--red)}.switch{position:relative;width:43px;height:25px;flex:0 0 43px;border-radius:99px;background:#cbd5e1;transition:.2s}.switch:after{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;border-radius:50%;background:white;box-shadow:0 2px 5px #94a3b8;transition:.2s}.active.good .switch{background:#10b981}.active.bad .switch{background:#f43f5e}.active .switch:after{transform:translateX(18px)}.empty{padding:55px 25px;text-align:center}.empty .big{font-size:52px}.empty h2{margin:10px 0 5px}.empty p{max-width:480px;margin:0 auto 17px;color:var(--muted)}.footer{margin-top:20px;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.78rem}.footer-actions{display:flex;gap:4px}.modal-shade{position:fixed;z-index:20;inset:0;background:rgba(15,23,42,.48);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}.modal-shade.open{display:flex}.modal{width:min(530px,100%);max-height:90vh;overflow:auto;border-radius:26px;background:white;padding:23px;box-shadow:0 30px 80px rgba(15,23,42,.3)}.modal-top{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:18px}.modal h2{margin:0;font-size:1.3rem}.modal-sub{color:var(--muted);font-size:.82rem;margin:3px 0 0}.close{height:38px;width:38px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:20px}.field{display:block;margin:13px 0}.field span{display:block;margin-bottom:6px;color:#334155;font-size:.82rem;font-weight:850}.field input,.field select{width:100%;border:1px solid var(--line);background:#f8fafc;border-radius:12px;padding:11px;outline:0}.field input:focus,.field select:focus{background:#fff;border-color:#818cf8;box-shadow:0 0 0 4px #eef2ff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.manage-section{margin-top:19px}.manage-head{display:flex;justify-content:space-between;align-items:center}.manage-head h3{margin:0}.manage-row{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:13px;padding:10px;margin-top:7px}.manage-row .grow{flex:1;min-width:0}.manage-row strong{display:block;font-size:.83rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.manage-row small{color:var(--muted)}.toast{position:fixed;z-index:30;bottom:20px;left:50%;transform:translate(-50%,100px);opacity:0;background:#172033;color:#fff;border-radius:99px;padding:11px 18px;font-size:.84rem;font-weight:800;transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}.danger-zone{border-top:1px solid var(--line);margin-top:20px;padding-top:15px}.hidden{display:none!important}
    @media(max-width:920px){.topbar{align-items:flex-start;flex-direction:column}.dashboard{grid-template-columns:1fr}.people{grid-template-columns:1fr}}
    @media(max-width:640px){.app{padding:16px 11px 30px}.actions .btn{flex:1}.date-box{align-items:flex-start;flex-direction:column}.date-controls{width:100%;flex-wrap:wrap}.date-controls input{flex:1}.lists{grid-template-columns:1fr}.person-top{align-items:flex-start}.form-grid{grid-template-columns:1fr}.footer{align-items:flex-start;flex-direction:column;gap:8px}.brand p{font-size:.8rem}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand"><div class="logo">🏦</div><div><h1>Kids Chore Bank ✨</h1><p>Small jobs, smart choices, big goals.</p></div></div><div class="actions"><button class="btn primary" data-action="add-person">＋ Add child</button><button class="btn good" data-action="add-chore">＋ Add chore</button><button class="btn bad" data-action="add-behaviour">＋ Add behaviour</button><button class="btn icon" data-action="manage" title="Manage">⚙️</button></div></header>
  <section class="dashboard"><div class="date-box"><div class="date-heading"><div class="date-icon">📅</div><div><div class="eyebrow">Tracking date</div><strong id="dateLabel"></strong></div></div><div class="date-controls"><button class="btn icon" data-action="previous-day" aria-label="Previous day">‹</button><input id="selectedDate" type="date"><button class="btn icon" data-action="next-day" aria-label="Next day">›</button><button class="btn dark small" data-action="today">Today</button></div></div><div class="summaries"><div class="summary-card dark"><div class="summary-label">💵 Family total</div><div id="familyTotal" class="summary-value">$0.00</div></div><div class="summary-card"><div class="summary-label">✅ Jobs done</div><div id="jobsDone" class="summary-value">0</div></div></div></section>
  <main id="peopleArea"></main>
  <footer class="footer"><span>💾 Saved automatically in this browser</span><div class="footer-actions"><button class="btn small" data-action="backup">⬇ Backup</button><label class="btn small">⬆ Restore<input id="restoreInput" class="hidden" type="file" accept="application/json"></label></div></footer>
</div>
<div id="modalShade" class="modal-shade"><div class="modal"><div class="modal-top"><div><h2 id="modalTitle"></h2><p id="modalSubtitle" class="modal-sub"></p></div><button class="close" data-action="close-modal" aria-label="Close">×</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script>
(() => {
  'use strict';
  const KEY='kids-chore-bank-html-v1';
  const money=new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'});
  const iconOptions={chores:[['🛏️','Make bed'],['🧹','Cleaning'],['🍽️','Dishes'],['📚','Reading'],['🧸','Put toys away'],['👕','Laundry'],['🗑️','Take rubbish out'],['🐶','Pet care'],['🌱','Garden'],['🧼','Wash or clean'],['🪥','Brush teeth'],['🎒','Pack school bag'],['📝','Homework'],['👟','Put shoes away'],['🚗','Help with car'],['🍳','Help cooking'],['✅','General chore'],['⭐','Special task']],behaviours:[['👂','Not listening'],['🌩️','Arguing'],['💭','Unkind words'],['😤','Bad attitude'],['📢','Shouting'],['🤥','Not being honest'],['🚫','Breaking a rule'],['📱','Too much screen time'],['⏰','Not ready on time'],['🧸','Not sharing'],['🙅','Refusing'],['😠','Angry behaviour'],['⚠️','Warning'],['❌','General behaviour']]};
  const colours={violet:{soft:'#f5f3ff',accent:'#7c3aed'},sky:{soft:'#f0f9ff',accent:'#0284c7'},emerald:{soft:'#ecfdf5',accent:'#059669'},amber:{soft:'#fffbeb',accent:'#d97706'},rose:{soft:'#fff1f2',accent:'#e11d48'}};
  const fresh=()=>({people:[{id:'p-ava',name:'Ava',avatar:'🦄',color:'violet',goal:10},{id:'p-noah',name:'Noah',avatar:'🚀',color:'sky',goal:10}],chores:[{id:'c-bed',name:'Make the bed',value:.5,icon:'🛏️'},{id:'c-room',name:'Tidy the room',value:1,icon:'🧹'},{id:'c-dishes',name:'Help with dishes',value:.75,icon:'🍽️'},{id:'c-reading',name:'Read for 20 minutes',value:.5,icon:'📚'}],behaviours:[{id:'b-listen',name:'Not listening',value:-.5,icon:'👂'},{id:'b-argue',name:'Arguing',value:-.5,icon:'🌩️'},{id:'b-unkind',name:'Unkind behaviour',value:-.75,icon:'💭'}],records:{}});
  const clone=x=>JSON.parse(JSON.stringify(x));
  let data=fresh(),selectedDate=localDate(),modalState=null;
  try{const saved=localStorage.getItem(KEY);if(saved)data=Object.assign(fresh(),JSON.parse(saved));}catch(e){console.warn(e)}
  const $=s=>document.querySelector(s), escape=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  function localDate(d=new Date()){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
  function addDays(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)}
  function key(pid,type,iid,date=selectedDate){return [date,pid,type,iid].join('|')}
  function save(){localStorage.setItem(KEY,JSON.stringify(data))}
  function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
  function stats(person,all=false){let earned=0,lost=0,completed=0,penalties=0;const count=(type,id)=>all?Object.entries(data.records).filter(([k,v])=>v&&k.split('|')[1]===person.id&&k.split('|')[2]===type&&k.split('|')[3]===id).length:(data.records[key(person.id,type,id)]?1:0);data.chores.forEach(i=>{const n=count('chore',i.id);earned+=i.value*n;completed+=n});data.behaviours.forEach(i=>{const n=count('behaviour',i.id);lost+=Math.abs(i.value)*n;penalties+=n});return{earned,lost,total:earned-lost,completed,penalties}}
  function mood(s){if(s.total>=5)return['🤩','Amazing day!','#d1fae5','#047857'];if(s.total>=2)return['😄','Doing great','#e0f2fe','#0369a1'];if(s.total<0||s.penalties>s.completed)return['🌤️','Fresh start ahead','#fef3c7','#92400e'];if(s.completed)return['🙂','Good progress','#e0e7ff','#4338ca'];return['😐','Ready to start','#f1f5f9','#475569']}
  function toggleRow(person,item,type,positive){const active=!!data.records[key(person.id,type,item.id)];return `<button class="toggle-item ${positive?'good':'bad'} ${active?'active':''}" data-toggle="${escape(person.id)}|${type}|${escape(item.id)}"><span class="item-icon">${escape(item.icon)}</span><span class="item-info"><span class="item-name">${escape(item.name)}</span><span class="item-amount">${positive?'+':'−'}${money.format(Math.abs(item.value))}</span></span><span class="switch"></span></button>`}
  function render(){const date=new Date(selectedDate+'T12:00:00');$('#selectedDate').value=selectedDate;$('#dateLabel').textContent=date.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});let family=0,jobs=0;data.people.forEach(p=>{const s=stats(p);family+=s.total;jobs+=s.completed});$('#familyTotal').textContent=money.format(family);$('#familyTotal').style.color=family<0?'#fda4af':'';$('#jobsDone').textContent=jobs;const area=$('#peopleArea');if(!data.people.length){area.innerHTML=`<section class="empty"><div class="big">👨‍👩‍👧‍👦</div><h2>Add your first saver</h2><p>Create a child profile, then start ticking off chores and tracking progress.</p><button class="btn primary" data-action="add-person">Add a child</button></section>`;return}area.innerHTML=`<section class="people">${data.people.map(person=>{const day=stats(person),all=stats(person,true),m=mood(day),c=colours[person.color]||colours.violet,progress=Math.min(100,Math.max(0,all.total/person.goal*100));return `<article class="person-card" style="--soft:${c.soft};--accent:${c.accent}"><div class="person-head"><div class="person-top"><div class="identity"><div class="avatar">${escape(person.avatar)}</div><div><div class="person-name">${escape(person.name)} <button class="link-button" data-edit-person="${escape(person.id)}" title="Edit">✎</button></div><div class="mood" style="background:${m[2]};color:${m[3]}">${m[0]} ${m[1]}</div></div></div><div class="day-total"><span>Selected day</span><strong style="${day.total<0?'color:#e11d48':''}">${money.format(day.total)}</strong></div></div><div class="goal"><div class="goal-row"><span>🎯 Savings goal</span><span>${money.format(Math.max(0,all.total))} of ${money.format(person.goal)}</span></div><div class="progress"><div style="width:${progress}%"></div></div></div></div><div class="lists"><div><div class="section-title"><h3>✅ Chores</h3><span class="pill green">+${money.format(day.earned)}</span></div><div class="item-list">${data.chores.length?data.chores.map(i=>toggleRow(person,i,'chore',true)).join(''):'<small>No chores yet</small>'}</div></div><div><div class="section-title"><h3>⚠️ Behaviours</h3><span class="pill red">−${money.format(day.lost)}</span></div><div class="item-list">${data.behaviours.length?data.behaviours.map(i=>toggleRow(person,i,'behaviour',false)).join(''):'<small>No behaviours yet</small>'}</div></div></div></article>`}).join('')}</section>`}
  function openModal(title,subtitle,body,state){modalState=state;$('#modalTitle').textContent=title;$('#modalSubtitle').textContent=subtitle;$('#modalBody').innerHTML=body;$('#modalShade').classList.add('open');setTimeout(()=>$('#modalBody input')?.focus(),30)}
  function closeModal(){$('#modalShade').classList.remove('open');modalState=null}
  function personModal(person){const edit=!!person,p=person||{name:'',avatar:'⭐',goal:10,color:'violet'};openModal(edit?'Edit child':'Add a child','Create a friendly profile and savings target.',`<form id="personForm"><label class="field"><span>Name</span><input name="name" required maxlength="40" value="${escape(p.name)}" placeholder="e.g. Mia"></label><div class="form-grid"><label class="field"><span>Avatar</span><select name="avatar">${['⭐','🦄','🚀','🦊','🐼','🐯','🐨','🐸','🦁','🐶','🐱','🌈','⚽','🎨'].map(x=>`<option ${x===p.avatar?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>Goal (AUD)</span><input name="goal" type="number" min="1" step="0.5" value="${p.goal}"></label></div><label class="field"><span>Colour</span><select name="color">${Object.keys(colours).map(x=>`<option value="${x}" ${x===p.color?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></label><div class="modal-actions">${edit?'<button type="button" class="btn bad" data-action="delete-person">Remove</button>':''}<button class="btn primary">${edit?'Save changes':'Add child'}</button></div></form>`,{kind:'person',person});}
  function itemModal(type,item){const chores=type==='chores',edit=!!item,x=item||{name:'',icon:chores?'✅':'⚠️',value:chores?.5:-.5};openModal(`${edit?'Edit':'Add'} ${chores?'chore':'behaviour'}`,chores?'Set a reward for completing this task.':'Set the amount deducted when this occurs.',`<form id="itemForm"><label class="field"><span>Name</span><input name="name" required maxlength="60" value="${escape(x.name)}" placeholder="${chores?'e.g. Put toys away':'e.g. Speaking unkindly'}"></label><div class="form-grid"><label class="field"><span>Choose an icon</span><select name="icon">${iconOptions[type].map(([icon,label])=>`<option value="${icon}" ${icon===x.icon?'selected':''}>${icon} ${label}</option>`).join('')}</select></label><label class="field"><span>Amount (AUD)</span><input name="value" type="number" required min="0.05" step="0.05" value="${Math.abs(x.value)}"></label></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn ${chores?'good':'bad'}">Save</button></div></form>`,{kind:'item',type,item});}
  function manageModal(){const rows=type=>data[type].map(i=>`<div class="manage-row"><span style="font-size:21px">${escape(i.icon)}</span><div class="grow"><strong>${escape(i.name)}</strong><small>${money.format(Math.abs(i.value))}</small></div><button class="btn small" data-edit-item="${type}|${escape(i.id)}">Edit</button><button class="btn small bad" data-delete-item="${type}|${escape(i.id)}">Delete</button></div>`).join('')||'<p class="modal-sub">No items yet.</p>';openModal('Manage chores & behaviours','Edit rewards, deductions and labels.',`<section class="manage-section"><div class="manage-head"><h3 style="color:#047857">Chores</h3><button class="btn small good" data-action="add-chore">＋ Add</button></div>${rows('chores')}</section><section class="manage-section"><div class="manage-head"><h3 style="color:#be123c">Behaviours</h3><button class="btn small bad" data-action="add-behaviour">＋ Add</button></div>${rows('behaviours')}</section><div class="danger-zone"><button class="btn bad" data-action="reset">↻ Reset all app data</button></div>`,{kind:'manage'})}
  document.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action){if(action==='add-person')personModal();if(action==='add-chore')itemModal('chores');if(action==='add-behaviour')itemModal('behaviours');if(action==='manage')manageModal();if(action==='close-modal')closeModal();if(action==='previous-day'){selectedDate=addDays(selectedDate,-1);render()}if(action==='next-day'){selectedDate=addDays(selectedDate,1);render()}if(action==='today'){selectedDate=localDate();render()}if(action==='backup')backup();if(action==='delete-person'&&modalState?.person){if(confirm(`Remove ${modalState.person.name} and their records?`)){const id=modalState.person.id;data.people=data.people.filter(p=>p.id!==id);data.records=Object.fromEntries(Object.entries(data.records).filter(([k])=>k.split('|')[1]!==id));save();closeModal();render();toast('Child removed')}}if(action==='reset'&&confirm('Reset all app data? This cannot be undone.')){data=fresh();save();closeModal();render();toast('App reset')}}const t=e.target.closest('[data-toggle]');if(t){const[pid,type,iid]=t.dataset.toggle.split('|'),k=key(pid,type,iid);data.records[k]=!data.records[k];save();render()}const ep=e.target.closest('[data-edit-person]');if(ep)personModal(data.people.find(p=>p.id===ep.dataset.editPerson));const ei=e.target.closest('[data-edit-item]');if(ei){const[type,id]=ei.dataset.editItem.split('|');itemModal(type,data[type].find(i=>i.id===id))}const di=e.target.closest('[data-delete-item]');if(di){const[type,id]=di.dataset.deleteItem.split('|'),item=data[type].find(i=>i.id===id);if(confirm(`Remove “${item.name}”?`)){const rt=type==='chores'?'chore':'behaviour';data[type]=data[type].filter(i=>i.id!==id);data.records=Object.fromEntries(Object.entries(data.records).filter(([k])=>!(k.split('|')[2]===rt&&k.split('|')[3]===id)));save();manageModal();render();toast('Item removed')}}});
  document.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(e.target.id==='personForm'){const person={id:modalState.person?.id||'p-'+Date.now(),name:f.get('name').trim(),avatar:f.get('avatar'),goal:Math.max(1,Number(f.get('goal'))||10),color:f.get('color')};data.people=modalState.person?data.people.map(p=>p.id===person.id?person:p):[...data.people,person];save();closeModal();render();toast(modalState?.person?'Profile updated':'Child added')}if(e.target.id==='itemForm'){const positive=modalState.type==='chores',item={id:modalState.item?.id||(positive?'c-':'b-')+Date.now(),name:f.get('name').trim(),icon:f.get('icon'),value:Math.abs(Number(f.get('value'))||.5)*(positive?1:-1)};data[modalState.type]=modalState.item?data[modalState.type].map(i=>i.id===item.id?item:i):[...data[modalState.type],item];save();closeModal();render();toast(modalState?.item?'Item updated':'Item added')}});
  $('#selectedDate').addEventListener('change',e=>{selectedDate=e.target.value||localDate();render()});$('#modalShade').addEventListener('mousedown',e=>{if(e.target.id==='modalShade')closeModal()});
  function backup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`kids-bank-backup-${localDate()}.json`;a.click();URL.revokeObjectURL(url);toast('Backup downloaded')}
  $('#restoreInput').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.people)||!Array.isArray(x.chores)||!Array.isArray(x.behaviours)||typeof x.records!=='object')throw Error();data=x;save();render();toast('Backup restored')}catch{alert('This is not a valid Kids Chore Bank backup.')}};r.readAsText(file);e.target.value=''});
  render();
})();
</script>
</body>
</html>
